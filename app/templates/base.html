<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Cognitive-Load Scheduler</title>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Cognitive-Load Scheduler</h1>
    <nav>
      <a href="/plan" class="{{ 'active' if request.url.path == '/plan' else '' }}">Plan</a>
      <a href="/calendar" class="{{ 'active' if request.url.path == '/calendar' else '' }}">Calendar</a>
      <a href="/tasks" class="{{ 'active' if request.url.path == '/tasks' else '' }}">Tasks</a>
      <a href="/overview" class="{{ 'active' if request.url.path == '/overview' else '' }}">Overview</a>
      <a href="/settings" class="{{ 'active' if request.url.path == '/settings' else '' }}">Settings</a>
    </nav>
    <div id="llm-badge" hx-get="/llm/badge" hx-trigger="load, every 30s" hx-swap="innerHTML"></div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
