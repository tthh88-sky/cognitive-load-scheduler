services:
  - type: web
    name: cognitive-load-scheduler
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2
      - key: LLM_PROVIDER
        value: none
